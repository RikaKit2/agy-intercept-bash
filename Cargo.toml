[package]
name = "agy-intercept-bash"
version = "0.2.2"
edition = "2021"
authors = ["RikaKit2"]
description = "Deterministic Bash and Shell Interceptor Hook for AntiGravity CLI (agy) in pure Rust std"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
strip = true
panic = "abort"
