# /etc/antigravity/intercept-bash.toml
# Декларативная и неизменяемая (read-only) конфигурация перехватчика команд AntiGravity CLI.
# Изменяется исключительно при пересборке системы NixOS (nr-switch).

[general]
# Лимит параллельных потоков компиляции на хосте (Intel i3-6006U: 2 ядра / 4 потока)
max_cargo_jobs = 2

[workspaces]
# Доверенные рабочие пространства: безопасные команды выполняются автоматически без лишних подтверждений
trusted = [
  "/home/user/nixos-config"
]

# Запрещённые для Bash рабочие пространства: вызовы run_command блокируются
# Агент должен использовать исключительно нативные инструменты (read_file, edit_file, mcpls LSP, codebase-memory)
# Сюда можно добавлять проекты с полным запретом Bash
forbidden_bash = []

[commands]
# Белый список разрешённых исполняемых файлов
allow = [
  "cargo",
  "rustc",
  "rustup",
  "git",
  "nix",
  "nixos-rebuild",
  "nix-build",
  "nix-shell",
  "nix-prefetch-url",
  "nvfetcher",
  "gh",
  "nr-switch",
  "prek",
  "rust-scaffold",
  "agy",
  "bs",
  "samply",
  "ferric",
  "profiler-cli",
  "pq",
  "dhat-to-flamegraph",
  "jq",
  "cd",
  "pwd",
  "echo",
  "printf",
  "mkdir",
  "cp",
  "mv",
  "touch",
  "which",
  "whereis",
  "type",
  "curl",
  "wget",
  "tar",
  "gzip",
  "gunzip",
  "xz",
  "unzip",
  "zip",
  "python",
  "python3",
  "chmod",
  "test",
  "[",
  "true",
  "false",
  "mcpls",
  "lspmux",
  "clear",
  "diff",
  "ls",
  "tree",
  "fd",
  "rg",
  "grep",
  "head",
  "tail",
  "wc",
  "stat",
  "file"
]

# Разрешённые фильтры в пайплайнах (cmd | filter)
allow_pipe_filters = [
  "grep",
  "rg",
  "head",
  "tail",
  "wc",
  "sed",
  "awk",
  "cut",
  "tr",
  "sort",
  "uniq",
  "jq",
  "cat",
  "bat",
  "less",
  "more",
  "tee"
]

# Команды, заблокированные в пользу нативных инструментов agy-cli
# (ls/fd/rg/grep/tree разрешены, т.к. list_dir/find_by_name/grep_search в agy-cli отсутствуют)
[commands.forbidden_native]
cat = "Не используй `cat` в Bash для чтения файлов. Используй нативный инструмент `read_file`."

[security]
# Системные деструктивные команды (блокируются безусловно)
destructive_commands = [
  "mkfs",
  "wipefs",
  "shred",
  "fdisk",
  "parted",
  "reboot",
  "shutdown",
  "poweroff",
  "su",
  "doas"
]

# Паттерны опасных операций (рекурсивное удаление, форс-пуши, прямые пайпы из сети)
[[security.deny_patterns]]
pattern = "rm\\s+.*-(r.*f|f.*r)"
reason = "Заблокировано опасное рекурсивное/принудительное удаление (rm -rf)."

[[security.deny_patterns]]
pattern = "dd\\s+if="
reason = "Заблокирована команда прямого блочного чтения/записи dd."

[[security.deny_patterns]]
pattern = "(curl|wget).*\\|.*(sh|bash|zsh|fish|dash|python3?)"
reason = "Заблокировано выполнение внешних скриптов напрямую из сети."

[[security.deny_patterns]]
pattern = "(sh|bash|zsh|fish|source)\\s+<\\(\\s*(curl|wget)"
reason = "Заблокировано выполнение внешних скриптов через подстановку процесса."

[[security.deny_patterns]]
pattern = "git\\s+(push\\s+(--force|-f)|reset\\s+--hard|clean\\s+-[a-zA-Z]*f)"
reason = "Заблокирована деструктивная Git-операция."

[[security.deny_patterns]]
pattern = "git\\s+(restore\\b|checkout\\s+--(\\s|$)|branch\\s+-D\\b|rebase\\b|filter-branch\\b)"
reason = "Заблокирована деструктивная Git-операция."

[[security.deny_patterns]]
pattern = "git\\s+config\\s+.*(core\\.sshCommand|core\\.fsmonitor|core\\.pager|alias\\.)"
reason = "Заблокирована небезопасная конфигурация Git."

[[security.deny_patterns]]
pattern = "awk\\b.*\\b(system\\s*\\(|getline\\b)"
reason = "Заблокировано выполнение произвольных команд или чтение через awk."

[[security.deny_patterns]]
pattern = "python3?\\b.*\\b(rmtree|os\\.remove|os\\.unlink|os\\.system|subprocess|Popen)\\b"
reason = "Заблокировано выполнение произвольных команд или удаление файлов через Python."
