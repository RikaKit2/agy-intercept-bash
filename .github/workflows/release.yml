name: Release & CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'master' && github.sha || 'anysha' }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package release assets
        run: |
          PKG_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="agy-intercept-bash") | "v" + .version')
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="$PKG_VERSION"
          fi

          echo "Packaging version: ${VERSION}"

          # Compute SHA-256 for standalone binary
          sha256sum target/release/agy-intercept-bash > target/release/agy-intercept-bash.sha256

          # Create compressed tarball
          ARCHIVE_NAME="agy-intercept-bash-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" -C target/release agy-intercept-bash
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-intercept-bash-linux-x86_64
          path: |
            target/release/agy-intercept-bash
            target/release/agy-intercept-bash.sha256

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/agy-intercept-bash
            target/release/agy-intercept-bash.sha256
            agy-intercept-bash-*-x86_64-unknown-linux-gnu.tar.gz
            agy-intercept-bash-*-x86_64-unknown-linux-gnu.tar.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
